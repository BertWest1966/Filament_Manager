<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR-sticker afdrukken</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#e5e7eb;color:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:8px;padding:10px;background:#fff;border-bottom:1px solid #d1d5db}
    .toolbar a,.toolbar button{min-height:44px;padding:10px 14px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#111827;text-decoration:none;font:inherit}
    .toolbar button{background:#111827;color:#fff;border-color:#111827;font-weight:700}
    .sheet{background:#fff;margin:12px auto}
    .label{position:relative;border:1.4px dashed #000;background:#fff;display:grid;grid-template-columns:48mm 1fr;gap:6mm;align-items:center;padding:5mm}
    .qr-box{border:1px dashed #000;padding:2mm}
    .qr-box img{display:block;width:100%;height:auto}
    .number{font-size:34pt;font-weight:900;line-height:1;letter-spacing:1mm;margin-bottom:3mm}
    .main{font-size:16pt;font-weight:800;margin-bottom:2mm}
    .line{font-size:13pt;font-weight:700;margin-top:1mm}
    .small{font-size:10pt;margin-top:1.5mm}
    .kind{font-size:10pt;font-weight:900;text-transform:uppercase;margin-top:3mm}
    .error{padding:20px;background:#fff;margin:12px;border-radius:10px}
    .label-format{width:200mm;height:60mm}
    .a4-format{width:190mm;min-height:80mm;padding:5mm}
    @media(max-width:900px){
      .sheet{width:calc(100vw - 16px)!important;height:auto!important;margin:8px}
      .label{grid-template-columns:35% 1fr;gap:10px;padding:12px}
      .number{font-size:34px}
      .main{font-size:18px}
      .line{font-size:15px}
    }
    @media print{
      body{background:#fff}
      .toolbar{display:none!important}
      .sheet{margin:0!important}
      .label-format{width:200mm!important;height:60mm!important}
      .a4-format{width:190mm!important}
      @page{margin:0}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="index.html">← Terug</a>
    <button id="printBtn" type="button">Afdrukken</button>
  </div>
  <main id="sheet" class="sheet"></main>
<script>
(() => {
  const params=new URLSearchParams(location.search);
  const kind=(params.get('kind')||'spoel').toLowerCase();
  const number=(params.get('number')||'').toUpperCase();
  const format=params.get('format')||'label200x60';

  function esc(value){
    return String(value??'').replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function getState(){
    const keys=['filament_manager_v7_1','filament_manager','filament_manager_state'];
    for(const key of keys){
      try{
        const raw=localStorage.getItem(key);
        if(!raw)continue;
        const value=JSON.parse(raw);
        if(value && Array.isArray(value.catalog))return value;
      }catch{}
    }
    return null;
  }

  const state=getState();
  const source=kind==='spoel'?(state?.spools||[]):(state?.refills||[]);
  const item=source.find(x=>String(x.number).toUpperCase()===number);
  const filament=item?(state?.catalog||[]).find(f=>f.id===item.filamentId):null;
  const sheet=document.getElementById('sheet');

  if(!state || !item){
    sheet.innerHTML='<div class="error">Stickergegevens niet gevonden. Ga terug naar de app en open de QR-code opnieuw.</div>';
    document.getElementById('printBtn').disabled=true;
    return;
  }

  const payload=`filament-manager:${kind}:${number}`;
  const qr=`https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=8&data=${encodeURIComponent(payload)}`;

  sheet.className='sheet '+(format==='a4'?'a4-format':'label-format');
  sheet.innerHTML=`
    <div class="label">
      <div class="qr-box"><img src="${qr}" alt="QR-code"></div>
      <div>
        <div class="number">${esc(number)}</div>
        <div class="main">${esc(filament?.category||'')} ${esc(filament?.type||'')}</div>
        <div class="line">${esc(filament?.color||'')}</div>
        <div class="line">${esc(filament?.supplier||filament?.brand||'')}</div>
        <div class="small">${filament?.supplierRef?'Ref. '+esc(filament.supplierRef):''}</div>
        <div class="kind">${esc(kind)}</div>
      </div>
    </div>`;

  document.getElementById('printBtn').onclick=()=>window.print();
})();
</script>
</body>
</html>
