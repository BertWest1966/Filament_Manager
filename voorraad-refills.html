<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voorraad Refills</title>
<style>
:root{--line:#d1d5db;--muted:#6b7280}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:8px;padding:10px;background:#fff;border-bottom:1px solid var(--line)}
.toolbar a,.toolbar button{min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#111827;text-decoration:none;font:inherit}
.toolbar button{background:#111827;color:#fff;border-color:#111827;font-weight:700}
.page{width:210mm;min-height:297mm;margin:12px auto;padding:12mm;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.15)}
h1{font-size:18pt;margin:0 0 2mm}
.meta{display:flex;justify-content:space-between;gap:8mm;margin-bottom:5mm;font-size:9pt}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}
thead{display:table-header-group}
th{text-align:left;border-bottom:1.5px solid #000;padding:1.6mm 1.4mm}
td{border-bottom:.5px solid #aaa;padding:1.4mm;line-height:1.1}
th:nth-child(1),td:nth-child(1){width:18%}
th:nth-child(2),td:nth-child(2){width:20%}
th:nth-child(3),td:nth-child(3){width:44%}
th:nth-child(4),td:nth-child(4){width:18%}
tr{break-inside:avoid;page-break-inside:avoid}
@media(max-width:900px){.page{width:calc(100vw - 16px);min-height:0;margin:8px;padding:14px;box-shadow:none}h1{font-size:20px}table{font-size:12px}th,td{padding:6px 4px}}
@media print{body{background:#fff}.toolbar{display:none!important}.page{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}@page{size:A4 portrait;margin:12mm}}
</style>
</head>
<body>
<div class="toolbar"><a href="index.html">← Terug</a><button id="printBtn">Afdrukken</button></div>
<main class="page">
<h1>Filament Manager – Voorraad Refills</h1>
<div class="meta"><span id="printedAt"></span><span id="count"></span></div>
<table><thead><tr><th>Categorie</th><th>Type</th><th>Kleur</th><th>Nummer</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
(() => {
 const KIND='refills';
 const keys=['filament_manager_v7_1','filament_manager','filament_manager_state'];
 function getState(){for(const key of keys){try{const raw=localStorage.getItem(key);if(!raw)continue;const parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed.catalog))return parsed}catch(e){}}return {catalog:[],spools:[],refills:[]}}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 const state=getState();
 const map=new Map((state.catalog||[]).map(f=>[f.id,f]));
 const source=KIND==='spools'?(state.spools||[]):(state.refills||[]);
 const items=source.map(item=>{const f=map.get(item.filamentId)||{};return{category:f.category||'',type:f.type||'',color:f.color||'',number:item.number||''}})
 .sort((a,b)=>a.category.localeCompare(b.category,'nl')||a.type.localeCompare(b.type,'nl')||a.color.localeCompare(b.color,'nl')||a.number.localeCompare(b.number,'nl',{numeric:true}));
 printedAt.textContent='Afdrukdatum: '+new Date().toLocaleString('nl-BE');
 count.textContent='Aantal: '+items.length;
 rows.innerHTML=items.length?items.map(x=>`<tr><td>${esc(x.category)}</td><td>${esc(x.type)}</td><td>${esc(x.color)}</td><td>${esc(x.number)}</td></tr>`).join(''):'<tr><td colspan="4">Geen gegevens gevonden.</td></tr>';
 printBtn.onclick=()=>window.print();
})();
</script>
</body>
</html>
