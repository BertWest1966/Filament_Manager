<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Geselecteerde stickers</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#e5e7eb;color:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .toolbar{
      position:sticky;top:0;z-index:10;
      display:flex;justify-content:space-between;gap:8px;
      padding:10px;background:#fff;border-bottom:1px solid #d1d5db
    }
    .toolbar a,.toolbar button{
      min-height:44px;padding:10px 14px;border:1px solid #d1d5db;
      border-radius:9px;background:#fff;color:#111827;text-decoration:none;font:inherit
    }
    .toolbar button{background:#111827;color:#fff;border-color:#111827;font-weight:700}
    .sheet{
      width:210mm;min-height:297mm;margin:12px auto;padding:10mm;
      background:#fff;display:grid;grid-template-columns:repeat(2,95mm);
      gap:5mm;align-content:start;box-shadow:0 2px 14px rgba(0,0,0,.15)
    }
    .label{
      width:95mm;height:60mm;padding:4mm;
      border:1.3px dashed #000;background:#fff;
      display:grid;grid-template-columns:42mm 1fr;gap:4mm;
      align-items:center;break-inside:avoid;page-break-inside:avoid;overflow:hidden
    }
    .qr-box{border:1px dashed #000;padding:1.5mm}
    .qr-box img{display:block;width:100%;height:auto}
    .number{font-size:25pt;font-weight:900;line-height:1;letter-spacing:.8mm;margin-bottom:2mm}
    .main{font-size:11pt;font-weight:800;line-height:1.15}
    .line{font-size:9pt;font-weight:700;line-height:1.2;margin-top:.8mm}
    .small{font-size:7.5pt;margin-top:1mm}
    .kind{font-size:8pt;font-weight:900;text-transform:uppercase;margin-top:2mm}
    .empty{padding:20px;background:#fff;margin:12px;border-radius:10px}
    @media(max-width:900px){
      .sheet{
        width:calc(100vw - 16px);min-height:0;margin:8px;padding:8px;
        grid-template-columns:1fr;box-shadow:none
      }
      .label{width:100%;height:auto;min-height:150px}
    }
    @media print{
      body{background:#fff}
      .toolbar{display:none!important}
      .sheet{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}
      @page{size:A4 portrait;margin:10mm}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="index.html">← Terug</a>
    <button id="printBtn" type="button">Afdrukken</button>
  </div>
  <main id="sheet" class="sheet"></main>

<script>
(() => {
  function esc(value){
    return String(value??'').replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  let items=[];
  try{
    items=JSON.parse(sessionStorage.getItem('filament_manager_selected_labels')||'[]');
  }catch{}

  const sheet=document.getElementById('sheet');

  if(!Array.isArray(items)||!items.length){
    sheet.className='empty';
    sheet.textContent='Geen geselecteerde stickers gevonden. Ga terug en selecteer minstens één spoel of refill.';
    document.getElementById('printBtn').disabled=true;
    return;
  }

  sheet.innerHTML=items.map(item=>{
    const payload=`filament-manager:${item.kind}:${item.number}`;
    const qr=`https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=8&data=${encodeURIComponent(payload)}`;
    return `<section class="label">
      <div class="qr-box"><img src="${qr}" alt="QR-code ${esc(item.number)}"></div>
      <div>
        <div class="number">${esc(item.number)}</div>
        <div class="main">${esc(item.category)} ${esc(item.type)}</div>
        <div class="line">${esc(item.color)}</div>
        <div class="line">${esc(item.supplier)}</div>
        <div class="small">${item.reference?'Ref. '+esc(item.reference):''}</div>
        <div class="kind">${esc(item.kind)}</div>
      </div>
    </section>`;
  }).join('');

  document.getElementById('printBtn').onclick=()=>window.print();
})();
</script>
</body>
</html>
